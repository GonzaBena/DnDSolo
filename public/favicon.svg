    <polygon points="116,35 98,86 64,32" fill="#d1492e"/>
    <polygon points="12,35 30,86 12,93" fill="#b23d26"/>
    <polygon points="116,35 116,93 98,86" fill="#9a321f"/>
    <polygon points="30,86 98,86 64,122" fill="#9a321f"/>
    <polygon points="12,93 30,86 64,122" fill="#7e2a1a"/>
    <polygon points="98,86 116,93 64,122" fill="#6e2416"/>
    <polygon points="64,32 98,86 30,86" fill="#f2b134"/>
